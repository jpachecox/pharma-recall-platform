openapi: 3.0.3
info:
  title: Pharma Recall Platform API
  description: >
    Contrato de API v1 para la plataforma de alertas y retiros de
    medicamentos. Solo documenta los endpoints implementados; ver la
    sección "Pendientes" de docs/api-contract.md para lo que falta.
  version: 1.0.0

servers:
  - url: http://localhost:8000/api/v1
    description: Servidor de Desarrollo Local

paths:
  /login:
    post:
      summary: Iniciar sesión y obtener token Bearer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                  example: "admin@farmacia.com"
                password:
                  type: string
                  format: password
                  example: "password123"
      responses:
        '200':
          description: Login exitoso
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  access_token:
                    type: string
                  token_type:
                    type: string
                    example: "Bearer"
                  user:
                    $ref: '#/components/schemas/AuthUser'
        '401':
          description: Credenciales incorrectas
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          $ref: '#/components/responses/422ValidationError'

  /logout:
    post:
      summary: Cerrar sesión y revocar el token actual
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Sesión cerrada correctamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/401Unauthorized'

  /medications/search:
    get:
      summary: Buscar medicamentos por número de lote
      security:
        - bearerAuth: []
      parameters:
        - name: lot
          in: query
          required: true
          schema:
            type: string
        - name: start_date
          in: query
          schema:
            type: string
            format: date
        - name: end_date
          in: query
          schema:
            type: string
            format: date
        - name: per_page
          in: query
          schema:
            type: integer
            default: 15
      responses:
        '200':
          description: Lista paginada de medicamentos que coinciden con el lote
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Medication'
                  links:
                    $ref: '#/components/schemas/PaginationLinks'
                  meta:
                    $ref: '#/components/schemas/PaginationMeta'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '422':
          $ref: '#/components/responses/422ValidationError'

  /orders:
    get:
      summary: Listar órdenes que contienen un lote específico en un rango de fechas
      security:
        - bearerAuth: []
      parameters:
        - name: lot
          in: query
          required: true
          schema:
            type: string
        - name: start_date
          in: query
          schema:
            type: string
            format: date
        - name: end_date
          in: query
          schema:
            type: string
            format: date
        - name: per_page
          in: query
          schema:
            type: integer
            default: 15
      responses:
        '200':
          description: Lista paginada de órdenes
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/OrderWithCustomer'
                  links:
                    $ref: '#/components/schemas/PaginationLinks'
                  meta:
                    $ref: '#/components/schemas/PaginationMeta'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '422':
          $ref: '#/components/responses/422ValidationError'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Sanctum

  responses:
    '401Unauthorized':
      description: No autenticado
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            message: "Unauthenticated."
    '404NotFound':
      description: Recurso no encontrado
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            message: "Resource not found."
    '422ValidationError':
      description: Error de validación
      content:
        application/json:
          schema:
            type: object
            properties:
              message:
                type: string
                example: "The given data was invalid."
              errors:
                type: object
                additionalProperties:
                  type: array
                  items:
                    type: string
            example:
              message: "The given data was invalid."
              errors:
                lot: ["El número de lote es obligatorio."]

  schemas:
    ErrorResponse:
      type: object
      properties:
        message:
          type: string

    AuthUser:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        email:
          type: string

    Customer:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        email:
          type: string
        phone:
          type: string

    Medication:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        description:
          type: string
          nullable: true
        lot_number:
          type: string
        orders_count:
          type: integer
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    OrderMedicationItem:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        lot_number:
          type: string
        quantity:
          type: integer
        unit_price:
          type: string
          description: Decimal serializado como string (unit_price DECIMAL(10,2))

    OrderWithCustomer:
      type: object
      properties:
        id:
          type: integer
        purchase_date:
          type: string
          format: date-time
        customer:
          $ref: '#/components/schemas/Customer'
        medications:
          type: array
          items:
            $ref: '#/components/schemas/OrderMedicationItem'
        alerts_sent:
          type: integer

    PaginationLinks:
      type: object
      properties:
        first:
          type: string
        last:
          type: string

    PaginationMeta:
      type: object
      properties:
        current_page:
          type: integer
        last_page:
          type: integer
        per_page:
          type: integer
        total:
          type: integer